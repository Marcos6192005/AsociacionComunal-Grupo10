services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: asociacion_comunal
      POSTGRES_USER: admin_asociacion_comunal
      POSTGRES_PASSWORD: asociacioncomunal_2K26Proyecto
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend-asociacion-comunal/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_asociacion_comunal -d asociacion_comunal"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@asociacion-comunal.com
      PGADMIN_DEFAULT_PASSWORD: asociacioncomunal_2K26Proyecto
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data: